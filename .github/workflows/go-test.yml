name: Go Test

on:
  push:
    paths:
      - "lambda_go/**"
      - ".github/workflows/go-test.yml"
  pull_request:
    paths:
      - "lambda_go/**"
      - ".github/workflows/go-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lambda_go/go.mod
          cache-dependency-path: lambda_go/go.sum
      - name: go vet（静的解析）
        working-directory: lambda_go
        run: go vet ./...

      - name: Lambda ビルド確認（linux/arm64）
        working-directory: lambda_go
        run: GOOS=linux GOARCH=arm64 go build -o /dev/null .

      - name: Run tests
        working-directory: lambda_go
        run: go test ./... -v -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Race 検出（data race・goroutine 競合）
        working-directory: lambda_go
        run: go test -race ./... -count=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lambda_go/coverage.out
          flags: go
          fail_ci_if_error: false
